<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOX3R - Crear cuenta</title>
    <link rel="icon" href="../favicon/icono.jpg" type="image/jpg">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../css/registro_sesion.css">
    <link rel="stylesheet" href="../css/app.css">
    <script defer src="../js/catalogo.js"></script>
    <script defer src="../js/app.js"></script>
    <script defer src="../js/registro_sesion.js"></script>
</head>
<body>

<header class="navbar">
    <button type="button" class="menu-icon" aria-label="Abrir menú de navegación" aria-expanded="false" aria-controls="menu-principal">☰</button>
    <div class="logo">
        <a href="../index.html">GLOX3R</a>
    </div>

    <nav class="categorias" id="menu-principal" aria-label="Navegación principal">
        <ul>
            <li><a href="catalogo_hombre.html">Hombre</a></li>
            <li><a href="catalogo_mujer.html">Mujer</a></li>
            <li><a href="accesorios.html">Accesorios</a></li>
            <li><a href="novedades.html">Novedades</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>

    <div class="acciones">
        <form role="search">
            <input type="search" name="q" aria-label="Buscar productos" placeholder="Buscar en GLOX3R" autocomplete="off">
        </form>
        <a href="carrito_1.html" class="icono" aria-label="Ver carrito de compras">
            <i class='bx bx-shopping-bag'></i>
        </a>
        <a href="Inicio_sesion.html" class="icono" aria-label="Iniciar sesión">
            <i class='bx bx-user'></i>
        </a>
    </div>
</header>

<main class="contenedor">
    <section class="columna-beneficios">
        <div class="marca">GZ</div>
        <h1 class="izquierda_titulo">GLOX3R</h1>

        <h2>BENEFICIOS DE TU CUENTA</h2>

        <ul class="lista-beneficios">
            <li>
                <i class='bx bx-star'></i>
                <span>Acceso a novedades</span>
            </li>
            <li>
                <i class='bx bx-package'></i>
                <span>Envíos express</span>
            </li>
            <li>
                <i class='bx bx-crown'></i>
                <span>Ofertas Exclusivas</span>
            </li>
            <li>
                <i class='bx bx-support'></i>
                <span>Soporte</span>
            </li>
        </ul>
    </section>

    <section class="columna-formulario">
        <div class="formulario">
            <h2>CREAR CUENTA</h2>
            <p class="subtitulo">Completa tus datos para registrarte</p>

            <form id="form-registro" class="formulario-login" novalidate>

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                </div>

                <div class="campo">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>
                </div>

                <div class="campo">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>
                </div>

                <div class="campo">
                    <label for="clave">Clave</label>
                    <input type="password" id="clave" name="clave" placeholder="Mínimo 8 caracteres" minlength="8" required>
                </div>

                <div class="campo">
                    <label for="clave2">Confirmar clave</label>
                    <input type="password" id="clave2" name="clave2" placeholder="Repite tu contraseña" minlength="8" required>
                </div>

                <div class="opciones">
                    <label class="checkbox-label">
                        <input type="checkbox" name="terminos" required>
                        <span>Acepto los términos y condiciones</span>
                    </label>
                </div>

                <p id="mensaje-formulario" class="mensaje-formulario" role="alert"></p>
                <button type="submit" class="btn-iniciar">Crear cuenta</button>
            </form>

            <p class="texto-registro">
                ¿Ya tienes cuenta? <a href="Inicio_sesion.html">Inicia sesión</a>
            </p>
        </div>
    </section>
</main>

</body>
</html>
