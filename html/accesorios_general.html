<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesorios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="/css/accesorios.css">

</head>
<body>

<header class="navbar">
        <div class="menu-icon">☰</div>
        <div class="logo">
            <a  class="enlace" href="../index.html">GLOX3R</a>
        </div>
        <div class="acciones">
            <form action="/Buscar">
                <input type="text" placeholder="Buscar en GLOX3R">
            </form>

            <a href="/carrito" class="icono"> 
                <i class='bx bx-shopping-bag'></i> 
            </a>
            <a href="/cuenta" class="icono"> 
                <i class='bx bx-user'></i> 
            </a>
        </div>
</header>

<div id="demo" class="carousel slide banner-seccion-full" data-bs-ride="carousel">

  <div class="carousel-indicators">
    <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
  </div>
  
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="../image/catolo_mujer1.avif" alt="Mens Section 1" class="d-block" style="width:100%">
    </div>
    <div class="carousel-item">
      <img src="../image/catologo_mujer2.avif" alt="Mens Section 2" class="d-block" style="width:100%">
    </div>
    <div class="carousel-item">
      <img src="../image/catalogo_mujer3.avif" alt="Mens Section 3" class="d-block" style="width:100%">
    </div>
  </div>

  <h1 class="titulo-banner">Collection Section</h1>

  <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>

    <section class="seccion-productos fondo-gris">
        <div class="grid-accesorios">

           
            <div class="imagen-esquina">
                <img src="https://i.pinimg.com/736x/c7/af/64/c7af6423075f776b516bba3289be31a7.jpg" alt="Modelo Accesorios GLOX3R">
            </div>

            
            <div class="escalera-productos">
                
               
                <div class="tarjeta-producto escalon-1">
                    <div class="imagen-placeholder">
                        <img src="https://i.pinimg.com/736x/ea/79/9e/ea799e01ddb73426fb2fd23b89b3a141.jpg" alt="Gorro Tennis Club">
                    </div>
                    <h3>Tennis Club tee</h3>
                    <p class="precio">S/40.00</p>
                    <button class="boton-carrito">Agregar al carrito</button>
                </div>

                
                <div class="tarjeta-producto escalon-2">
                    <div class="imagen-placeholder">
                        <img src="https://i.pinimg.com/1200x/eb/a5/05/eba5053fd19c36e64a8a04ac3a3dde6b.jpg" alt="Collar Velvet Riot">
                    </div>
                    <h3>Velvet Riot</h3>
                    <p class="precio">S/40.00</p>
                    <button class="boton-carrito">Agregar al carrito</button>
                </div>

         
                <div class="tarjeta-producto escalon-3">
                    <div class="imagen-placeholder">
                        <img src="https://i.pinimg.com/1200x/56/41/38/564138c45141016f44eba30718ccf2fd.jpg" alt="Correa Midnight Bloom">
                    </div>
                    <h3>Midnight Bloom</h3>
                    <p class="precio">S/40.00</p>
                    <button class="boton-carrito">Agregar al carrito</button>
                </div>

              
                <div class="tarjeta-producto escalon-4">
                    <div class="imagen-placeholder">
                        <img src="https://i.pinimg.com/736x/71/a4/1f/71a41f9ece0428196833a200423f508e.jpg" alt="Anillo Neon">
                    </div>
                    <h3>Neon</h3>
                    <p class="precio">S/40.00</p>
                    <button class="boton-carrito">Agregar al carrito</button>
                </div>

            </div>

        </div>
    </section>

    <footer class="pie-pagina">
        <h2 class="logo-footer">GLOX3R</h2>
        <div class="redes-sociales">
            <span></span> <span></span> <span></span> <span></span> <span></span> <span></span>
        </div>
        <p class="texto-copyright">
            © 2026, glox3r - Política de Privacidad - Información del contacto - Términos del servicio - Política de reembolso - Preferencias de cookies - Libro de reclamaciones
        </p>
    </footer>

</body>
</html>
